<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Three.js</title>
</head>

<body>
  <div id="container">
    <!-- 进度条 -->
    <div id="per"> </div>
  </div>
  <!-- 顶部栏 -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 55px; background: rgba(0,0,0,0.1); padding: 5px;">
    <button type="button" id="download" name="download">下载</button>
  </div>

  <!-- type="importmap"功能：.html文件中也能和nodejs开发环境中一样方式，引入npm安装的js库 -->
  <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.174.0/build/three.module.js",
          "three/examples/jsm/": "https://esm.sh/three@0.174.0/examples/jsm/"
        }
      }
    </script>
  <script src="./index.js" type="module">
  </script>

</body>

</html>

<style>
  body {
    position: relative;
    overflow: hidden;
    margin: 0px;
    background-color: #222;
    color: white;
    font-family: Arial, sans-serif;
  }

  /* 进度条css样式 */
  #container {
    position: absolute;
    width: 400px;
    height: 16px;
    bottom: 10%;
    left: 50%;
    margin-left: -200px;
    margin-top: -8px;
    border-radius: 8px;
    border: 1px solid #009999;
    overflow: hidden;
  }

  #per {
    height: 100%;
    width: 0px;
    background: #00ffff;
    color: #00ffff;
    line-height: 15px;
  }
</style>
